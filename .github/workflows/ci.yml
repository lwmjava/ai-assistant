name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OFFICIAL_EVALUATION_AUTHORIZED: ${{ vars.OFFICIAL_EVALUATION_AUTHORIZED }}
  OFFICIAL_EVALUATION_BUDGET_REF: ${{ vars.OFFICIAL_EVALUATION_BUDGET_REF }}
  OFFICIAL_EVALUATION_AUTHORIZED_SHA: ${{ vars.OFFICIAL_EVALUATION_AUTHORIZED_SHA }}
  OFFICIAL_EVALUATION_AUTHORIZED_RUN_ID: ${{ vars.OFFICIAL_EVALUATION_AUTHORIZED_RUN_ID }}
  OFFICIAL_EVALUATION_AUTHORIZED_RUN_ATTEMPT: ${{ vars.OFFICIAL_EVALUATION_AUTHORIZED_RUN_ATTEMPT }}

jobs:
  backend:
    name: Backend (ruff / mypy / pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev,langgraph]"
          pip install psycopg2-binary==2.9.13
      - name: Ruff lint
        run: ruff check .
      - name: Mypy typecheck
        run: mypy app/
      - name: Start disposable PostgreSQL validation
        run: |  # pragma: allowlist secret
          python - <<'PY'
          import os
          import secrets
          import subprocess
          import time
          from sqlalchemy.engine import URL

          assert os.geteuid() != 0, "Linux resource tests require an unprivileged runner"
          password = secrets.token_hex(24)
          print("::add-mask::" + password, flush=True)
          name = "validation-postgres-backend-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
          environment = dict(os.environ, POSTGRES_PASSWORD=password)
          subprocess.run([
              "docker", "run", "--detach", "--name", name,
              "--label", "ci.validation.run=" + os.environ["GITHUB_RUN_ID"],
              "--publish", "127.0.0.1::5432", "--env", "POSTGRES_PASSWORD",
              "--env", "POSTGRES_DB=validation_00000000", "postgres:16",
          ], env=environment, check=True, capture_output=True, text=True)
          for attempt in range(30):
              ready = subprocess.run([
                  "docker", "exec", name, "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "postgres", "-d", "validation_00000000",
              ], capture_output=True)
              if ready.returncode == 0:
                  break
              time.sleep(2)
          else:
              raise RuntimeError("Disposable PostgreSQL did not become ready")
          published = subprocess.run(["docker", "port", name, "5432/tcp"],
                                     capture_output=True, text=True, check=True).stdout.strip()
          host, port = published.rsplit(":", 1)
          assert host == "127.0.0.1", "Validation service must bind only to loopback"
          url = URL.create("postgresql+psycopg2", username="postgres", password=password,
                           host=host, port=int(port), database="validation_00000000")
          value = url.render_as_string(hide_password=False)
          print("::add-mask::" + value, flush=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write("POSTGRES_VALIDATION_URL=" + value + "\nPOSTGRES_VALIDATION_REQUIRED=1\n")
          PY
      - name: Pytest
        run: |
          mkdir -p data/validation/ci-backend
          pytest --junitxml=data/validation/ci-backend/pytest.xml
      - name: Require real platform coverage
        run: python scripts/check_platform_validation.py --report data/validation/ci-backend/pytest.xml
      - name: Require official evaluation authorization
        env:
          OFFICIAL_EVALUATION_AUTHORIZED: ${{ vars.OFFICIAL_EVALUATION_AUTHORIZED }}
          OFFICIAL_EVALUATION_BUDGET_REF: ${{ vars.OFFICIAL_EVALUATION_BUDGET_REF }}
          OFFICIAL_EVALUATION_AUTHORIZED_SHA: ${{ vars.OFFICIAL_EVALUATION_AUTHORIZED_SHA }}
        run: |
          python - <<'PY'
          import os
          if (os.environ.get("OFFICIAL_EVALUATION_AUTHORIZED") != "true"
                  or not os.environ.get("OFFICIAL_EVALUATION_BUDGET_REF", "").strip()
                  or not os.environ.get("GITHUB_SHA")
                  or os.environ.get("OFFICIAL_EVALUATION_AUTHORIZED_SHA") != os.environ["GITHUB_SHA"]):
              raise SystemExit("OFFICIAL_EVALUATION_NOT_AUTHORIZED: explicit approval and budget record required")
          PY
      - name: RAG baseline gate
        env:
          RAG_BACKEND: native
          RAG_CHUNK_STRATEGY: structured
          RAG_VECTOR_STORE: local
          RAG_EFFECTIVE_DATE_FILTER: 'false'
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
        run: |
          python scripts/run_official_eval.py --budget-yuan 1 --ledger evals/reports/rag-budget.json scripts/run_rag_baseline.py --mode official --out evals/reports/rag-v0.1-baseline-ci.json
          python scripts/rag_gate_check.py --report evals/reports/rag-v0.1-baseline-ci.json --baseline evals/reports/rag-v0.1-baseline-20260919.json
      - name: Upload Backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/validation/ci-backend/pytest.xml
            evals/reports/rag-budget.json
          if-no-files-found: warn
          retention-days: 14

      - name: Stop disposable PostgreSQL
        if: always()
        run: |
          name="validation-postgres-backend-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker container inspect "$name" >/dev/null 2>&1; then
            owner=$(docker inspect --format '{{ index .Config.Labels "ci.validation.run" }}' "$name")
            test "$owner" = "$GITHUB_RUN_ID"
            docker rm --force "$name"
          fi

  # Compatible split: Backend still owns the required RAG gate. This job stays
  # off until ENABLE_RAG_OFFICIAL_JOB=true, so push/PR do not pay twice.
  rag-baseline:
    name: RAG official baseline
    if: vars.ENABLE_RAG_OFFICIAL_JOB == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev,langgraph]"
      - name: Require official evaluation authorization
        env:
          OFFICIAL_EVALUATION_AUTHORIZED: ${{ vars.OFFICIAL_EVALUATION_AUTHORIZED }}
          OFFICIAL_EVALUATION_BUDGET_REF: ${{ vars.OFFICIAL_EVALUATION_BUDGET_REF }}
          OFFICIAL_EVALUATION_AUTHORIZED_SHA: ${{ vars.OFFICIAL_EVALUATION_AUTHORIZED_SHA }}
        run: |
          python - <<'PY'
          import os
          if (os.environ.get("OFFICIAL_EVALUATION_AUTHORIZED") != "true"
                  or not os.environ.get("OFFICIAL_EVALUATION_BUDGET_REF", "").strip()
                  or not os.environ.get("GITHUB_SHA")
                  or os.environ.get("OFFICIAL_EVALUATION_AUTHORIZED_SHA") != os.environ["GITHUB_SHA"]):
              raise SystemExit("OFFICIAL_EVALUATION_NOT_AUTHORIZED: explicit approval and budget record required")
          PY
      - name: RAG baseline gate
        env:
          RAG_BACKEND: native
          RAG_CHUNK_STRATEGY: structured
          RAG_VECTOR_STORE: local
          RAG_EFFECTIVE_DATE_FILTER: 'false'
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
        run: |
          python scripts/run_official_eval.py --budget-yuan 1 --ledger evals/reports/rag-budget.json scripts/run_rag_baseline.py --mode official --out evals/reports/rag-v0.1-baseline-ci.json
          python scripts/rag_gate_check.py --report evals/reports/rag-v0.1-baseline-ci.json --baseline evals/reports/rag-v0.1-baseline-20260919.json
      - name: Upload RAG evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evals/reports/rag-v0.1-baseline-ci.json
            evals/reports/rag-budget.json
          if-no-files-found: warn
          retention-days: 14

  agent-baseline:
    name: Agent official baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAG_BACKEND: native
      LLM_PROVIDER: openai
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.deepseek.com/v1' }}
      LLM_DEFAULT_MODEL: ${{ vars.LLM_DEFAULT_MODEL || 'deepseek-flash' }}
      LLM_CHAT_FALLBACK_CHAIN: chat
      LLM_INTENT_FALLBACK_CHAIN: chat
      LLM_RESPONSE_CACHE_ENABLED: 'false'
      LLM_CAPABILITY_GUARD_ENABLED: 'true'
      LLM_CAPABILITY_DECLARED: ${{ vars.LLM_CAPABILITY_DECLARED }}
      LLM_CAPABILITY_DECLARED_SOURCE: ${{ vars.LLM_CAPABILITY_DECLARED_SOURCE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Require official evaluation authorization
        env:
          OFFICIAL_EVALUATION_AUTHORIZED: ${{ vars.OFFICIAL_EVALUATION_AUTHORIZED }}
          OFFICIAL_EVALUATION_BUDGET_REF: ${{ vars.OFFICIAL_EVALUATION_BUDGET_REF }}
          OFFICIAL_EVALUATION_AUTHORIZED_SHA: ${{ vars.OFFICIAL_EVALUATION_AUTHORIZED_SHA }}
        run: |
          python - <<'PY'
          import os
          if (os.environ.get("OFFICIAL_EVALUATION_AUTHORIZED") != "true"
                  or not os.environ.get("OFFICIAL_EVALUATION_BUDGET_REF", "").strip()
                  or not os.environ.get("GITHUB_SHA")
                  or os.environ.get("OFFICIAL_EVALUATION_AUTHORIZED_SHA") != os.environ["GITHUB_SHA"]):
              raise SystemExit("OFFICIAL_EVALUATION_NOT_AUTHORIZED: explicit approval and budget record required")
          PY
      - name: Agent official evaluation
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          python scripts/run_official_eval.py --budget-yuan 3 --ledger evals/reports/agent-ci/budget.json scripts/run_agent_chain_eval.py --mode official --out evals/reports/agent-ci/official.json
      - name: Agent report gate and regression probes
        run: |
          endpoint_hash=$(python - <<'PY'
          import contextlib
          import os
          import sys
          with contextlib.redirect_stdout(sys.stderr):
              from scripts.run_agent_chain_eval import endpoint_hash
          print(endpoint_hash(os.environ['LLM_BASE_URL']))
          PY
          )
          python scripts/agent_gate_check.py --report evals/reports/agent-ci/official.json --expected-model "$LLM_DEFAULT_MODEL" --expected-endpoint-hash "$endpoint_hash"
          python scripts/agent_gate_probe.py --report evals/reports/agent-ci/official.json --expected-model "$LLM_DEFAULT_MODEL" --expected-endpoint-hash "$endpoint_hash" --out-dir evals/reports/agent-ci/synthetic-probes
      - name: Upload Agent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-chain-${{ github.run_id }}-${{ github.run_attempt }}
          path: evals/reports/agent-ci/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend (typecheck / vitest / eslint / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Vitest
        working-directory: frontend
        run: npm test
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
