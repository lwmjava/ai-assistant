name: Security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: New secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install detect-secrets==1.5.0
      - name: Scan added credentials
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/security_checks.py secrets --base-ref "$BASE_SHA"

  dependencies:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pip-audit==2.10.1
      - name: Python audit
        run: python scripts/security_checks.py python-audit
      - name: npm audit
        if: ${{ !cancelled() }}
        run: python scripts/security_checks.py npm-audit
      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/validation/python-audit.json
            data/validation/npm-audit.json
          if-no-files-found: warn
          retention-days: 14
