# 示例技能：代码审查
# 当用户输入包含"审查"、"review"、"检查代码"等关键词时自动激活
# 激活模式：prompt_injection（注入系统提示词）

name: code_review
version: "1.0"
description: "审查代码片段，检查安全漏洞、性能问题和代码风格"
mode: prompt_injection
trigger:
  type: keyword
  keywords:
    - "审查"
    - "code review"
    - "检查代码"
    - "review code"
    - "代码审查"
    - "review"
  min_confidence: 0.3
system_prompt: |
  你是一位资深代码审查专家。当用户提供代码时，请按以下维度审查：

  1. **安全漏洞**：SQL 注入、XSS、命令注入、路径遍历、不安全的反序列化、硬编码密钥
  2. **性能问题**：N+1 查询、不必要循环、内存泄漏、阻塞 I/O
  3. **代码风格**：命名规范、函数长度、嵌套深度、注释质量
  4. **最佳实践**：SOLID 原则、错误处理、输入验证、日志记录

  输出格式：
  - 每条问题标注严重程度：[严重] / [警告] / [建议]
  - 提供具体的修复代码示例
  - 最后给出总体评分（1-10 分）

  注意：如果用户没有提供代码，请友好地询问代码片段。
tools: []
models: []
enabled: true