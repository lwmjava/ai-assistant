# 与根生产编排显式叠加；所有路径以第一个 -f 文件所在目录为基准。
services:
  app:
    build:
      args:
        INSTALL_MILVUS: "true"
    environment:
      RAG_VECTOR_STORE: milvus
      MILVUS_URI: http://milvus:19530
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
    depends_on:
      milvus:
        condition: service_healthy

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: ["etcd", "--advertise-client-urls=http://etcd:2379", "--listen-client-urls=http://0.0.0.0:2379", "--data-dir=/etcd"]
    volumes:
      - etcddata:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?必须提供MinIO访问账号}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?必须提供MinIO随机口令}
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    volumes:
      - miniodata:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g

  milvus:
    image: milvusdb/milvus:v2.5.11
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "false"
      ETCD_ENDPOINTS: etcd:2379
      COMMON_STORAGETYPE: minio
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?必须提供MinIO访问账号}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?必须提供MinIO随机口令}
    volumes:
      - milvusdata:/var/lib/milvus
      - ./deploy/milvus/user.yaml:/milvus/configs/user.yaml:ro
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 20s
      start_period: 90s
      retries: 10
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 4g

volumes:
  etcddata:
  miniodata:
  milvusdata:
