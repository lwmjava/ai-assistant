# 单实例生产配置；必须显式指定隔离的 --env-file。
# 默认包含应用、数据库和内部 Milvus（etcd + MinIO）。向量服务不发布宿主端口。
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiassistant}
      POSTGRES_DB: ${POSTGRES_DB:-aiassistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须提供数据库随机口令}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g

  app:
    build:
      context: .
      args:
        INSTALL_MILVUS: "true"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      ENV: production
      DATABASE_URL: ${DATABASE_URL:?必须提供指向db的数据库连接串并对口令做URL编码}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?必须提供随机JWT密钥}
      LLM_API_KEY: ${LLM_API_KEY:?必须提供模型密钥}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-deepseek-chat}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:?必须提供真实Embedding供应商}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?必须提供真实Embedding密钥}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:?必须提供Embedding服务地址}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?必须提供Embedding模型}
      EMBEDDING_DIM: ${EMBEDDING_DIM:?必须提供Embedding维度}
      RAG_VECTOR_STORE: milvus
      MILVUS_URI: http://milvus:19530
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      RAG_ENABLED: "true"
      SERVE_FRONTEND: "true"
      AUTH_ENABLED: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:?必须显式提供允许的前端来源}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_SYSTEM_PASSWORD: ${INITIAL_SYSTEM_PASSWORD:-}
      INITIAL_CULTURE_PASSWORD: ${INITIAL_CULTURE_PASSWORD:-}
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-8000}:8000"
    volumes:
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy
      milvus:
        condition: service_healthy
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 2g

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: ["etcd", "--advertise-client-urls=http://etcd:2379", "--listen-client-urls=http://0.0.0.0:2379", "--data-dir=/etcd"]
    volumes:
      - etcddata:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?必须提供MinIO访问账号}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?必须提供MinIO随机口令}
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    volumes:
      - miniodata:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g

  milvus:
    image: milvusdb/milvus:v2.5.11
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "false"
      ETCD_ENDPOINTS: etcd:2379
      COMMON_STORAGETYPE: minio
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?必须提供MinIO访问账号}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?必须提供MinIO随机口令}
    volumes:
      - milvusdata:/var/lib/milvus
      - ./deploy/milvus/user.yaml:/milvus/configs/user.yaml:ro
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 20s
      start_period: 90s
      retries: 10
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 4g

volumes:
  pgdata:
  appdata:
  etcddata:
  miniodata:
  milvusdata:
