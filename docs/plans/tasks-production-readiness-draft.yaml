# =============================================================================
# 生产就绪任务卡草案（待审核）
#
# 来源：按"企业可上线"标尺对 ai-assistant 现有 tasks.yaml（66 项，48 done）
#       做缺口审查后的补充方案。本文件为**草案**，尚未并入 tasks.yaml。
#
# 审核通过后如何落地：
#   1. 把下面 `tasks:` 列表中的任务卡追加到 tasks.yaml 的 `tasks:` 下
#   2. 同时需要修改 2 处现有任务的 depends_on（见文件末尾"需要改动的现有任务"）
#   3. target_date 目前全部留空，按你的实际速度填写
#
# 排期落位（三处插入 + 一个新增阶段）：
#   NFR-0        → 最前（验证手段，后续所有工作的回归与归因地基）
#   P-AGT        → 插在 D1 与 D2 之间
#   P-WFL        → 插在 D2 之后
#   P-RAG/P-MCP  → 插在 D3 与 D4 之间
#   E 阶段       → 新增，排在 D4 之后（现有 REL 只是 MVP 门禁，不是企业上线）
#
# 数量说明：4 个打磨阶段展开为 18 张可执行卡，18 项补充点各 1 张卡，合计 36 张。
#
# 证据口径：所有 facts.evidence 均来自 2026-09-28 实地扫描
#           （代码 grep、evals/reports/rag-v0.1-baseline-20260919.json、
#             docs/product/项目产品需求方案.md、AGENTS.md）。
# =============================================================================

tasks:

  # ---------------------------------------------------------------------------
  # NFR-0 · 验证手段（放最前）
  # ---------------------------------------------------------------------------

  - id: "NFR-001"
    title: "CI 流水线：lint、typecheck、pytest、前端构建"
    status: "backlog"
    priority: "P0"
    target_date: ""
    depends_on: []
    context:
      problem: "仓库没有任何自动化流水线，改动是否破坏回归完全依赖人工跑测试，长期无法支撑重构与打磨并行。"
      facts:
        - claim: "仓库不存在 .github 目录，零 CI 配置。"
          evidence: "ls -1 .github 无输出；PRD §4.5 要求 CI 全绿；项目设计方案 §4.1 明确要求 GitHub Actions"
        - claim: "已有可用的质量命令定义，但未接到流水线：pytest、ruff check .、mypy app/、npm ci、npm run typecheck、npm run build。"
          evidence: "tasks.yaml project.commands"
        - claim: "REL-003 是测试门禁，不是建流水线，二者不能互相替代。"
          evidence: "tasks.yaml REL-003 标题为「测试门禁（交付 D4）」"
    scope:
      allowed_paths:
        - ".github/"
        - "scripts/"
        - "pyproject.toml"
        - "frontend/package.json"
        - "docs/AI辅助开发迭代指导.md"
        - "README.md"
        - "tasks.yaml"
      forbidden_paths:
        - ".env"
        - "生产密钥"
        - "evals/reports/rag-v0.1-baseline-20260919.json"
      deliverables:
        - "GitHub Actions 工作流：ruff、mypy、pytest、前端 typecheck 与 build 串联"
        - "失败即阻断合并，README 展示状态徽标"
      non_goals:
        - "不做自动部署与自动发布"
        - "不引入第三方 CI 服务"
        - "不在本任务修复既有 65 个测试 error"
    acceptance:
      - "推送一次改动即可看到流水线运行与结果"
      - "任一步骤失败时工作流整体失败"
      - "本地复现命令与流水线命令一致"
    risk:
      level: "L1"
      side_effect: "ci-pipeline-added"
      rollback: "删除工作流文件即可，不影响运行时。"
    evaluation:
      cases:
        - "故意引入一处 lint 错误，流水线应失败"
        - "故意引入一处失败测试，流水线应失败"
      commands:
        - "ruff check ."
        - "mypy app/"
        - "pytest"
    execution:
      owner: "个人开发者"
      nightly:
        eligible: true
        production_access: false
        auto_merge: false
        auto_deploy: false

  - id: "NFR-002"
    title: "结构化日志：JSON 格式与 trace_id、user_id、tenant_id"
    status: "backlog"
    priority: "P0"
    target_date: ""
    depends_on: []
    context:
      problem: "当前日志无统一字段，跨模块问题无法按请求串联，RAG 与 Agent 的效果也无法归因。"
      facts:
        - claim: "日志使用标准库 logging.getLogger，不存在 trace_id、user_id、tenant_id 字段。"
          evidence: "grep -rn 'trace_id|tenant_id' app --include='*.py' 无输出；PRD §6.5 将其列为 P0"
        - claim: "SEC-002 只覆盖日志脱敏，不等价于结构化。"
          evidence: "tasks.yaml SEC-002 标题为「日志脱敏与界面错误提示」"
    scope:
      allowed_paths:
        - "app/core/"
        - "app/main.py"
        - "app/api/"
        - "tests/"
        - "docs/product/项目产品需求方案.md"
        - "tasks.yaml"
      forbidden_paths:
        - ".env"
        - "生产密钥"
      deliverables:
        - "日志输出为 JSON，含 trace_id、user_id、tenant_id"
        - "trace_id 贯穿一次请求全链路"
      non_goals:
        - "不引入外部日志平台"
        - "不改日志脱敏逻辑（属 SEC-002）"
        - "不做日志检索界面"
    acceptance:
      - "一次对话请求的所有日志可用同一 trace_id 检索"
      - "日志为合法 JSON 行"
      - "新增用例可被 pytest -k 'log or trace' 选中"
    risk:
      level: "L1"
      side_effect: "logging-format-changed"
      rollback: "回退日志格式提交，恢复原 formatter。"
    evaluation:
      cases:
        - "发起一次对话，检查日志是否含三字段且可串联"
      commands:
        - "pytest -k 'log or trace'"
    execution:
      owner: "个人开发者"
      nightly:
        eligible: true
        production_access: false
        auto_merge: false
        auto_deploy: false

  # ---------------------------------------------------------------------------
  # P-AGT · Agent 打磨（插在 D1 与 D2 之间）
  # ---------------------------------------------------------------------------

  - id: "PAGT-001"
    title: "补齐 web_search 与 file_ops 内置工具"
    status: "backlog"
    priority: "P0"
    target_date: ""
    depends_on:
      - "FLOW-001"
    context:
      problem: "PRD 承诺的工具未兑现，工具生态过窄，上层技能与 Supervisor 编排缺少可编排对象。"
      facts:
        - claim: "内置工具仅 4 个：calculator、code_sandbox、get_current_datetime、web_fetch，实现共 204 行。"
          evidence: "app/agents/tools/builtin.py"
        - claim: "PRD §5.1.2 承诺 web_search 并要求 4 个 provider 可插拔、启动校验、无 key 时标记 unavailable 并在 /health 提示；file_ops 同样缺失。实测二者均不存在。"
          evidence: "PRD §5.1.2；grep -rn 'web_search|file_ops' app/agents --include='*.py' 无输出"
    scope:
      allowed_paths:
        - "app/agents/tools/"
        - "app/core/config.py"
        - ".env.example"
        - "app/api/routes/"
        - "frontend/src/"
        - "tests/"
        - "tasks.yaml"
      forbidden_paths:
        - ".env"
        - "生产密钥"
      deliverables:
        - "web_search 支持多 provider 可插拔，缺 key 时标记 unavailable 并在 /health 可见"
        - "file_ops 受配置开关与路径白名单约束"
      non_goals:
        - "不实现文件系统的任意路径写入"
        - "不引入新的第三方搜索 SDK 之外的依赖"
        - "不改既有 4 个工具的签名"
    acceptance:
      - "未配置 key 时服务仍可启动，/health 显示工具不可用"
      - "配置 key 后 web_search 在对话中可被调用并返回来源"
      - "file_ops 越界路径被拒绝"
    risk:
      level: "L2"
      side_effect: "new-tools-exposed"
      rollback: "通过配置开关关闭新工具，回退提交。"
    evaluation:
      cases:
        - "无 key 启动，检查 /health 与工具列表"
        - "配置 key 后执行一次检索型提问"
      commands:
        - "pytest -k 'tool'"
    execution:
      owner: "个人开发者"
      nightly:
        eligible: true
        production_access: false
        auto_merge: false
        auto_deploy: false

  - id: "PAGT-002"
    title: "工具十要素契约：权限、风险分级、超时、幂等、审计"
    status: "backlog"
    priority: "P1"
    target_date: ""
    depends_on:
      - "PAGT-001"
    context:
      problem: "工具缺少统一契约，企业场景无法判断某个调用是否安全、可重试、需审批。"
      facts:
        - claim: "AGENTS.md §7 要求 Tool 具备十要素，含权限、风险 L0-L3、副作用、超时、幂等、错误模型、审计、版本。"
          evidence: "AGENTS.md §7；tasks.yaml risk_policy 已定义 L0-L3"
        - claim: "当前工具未体现风险分级与审计事件。"
          evidence: "app/agents/tools/builtin.py；grep -rn 'risk|audit|idempot' app/agents/tools/ 无输出"
    scope:
      allowed_paths:
        - "app/agents/tools/"
        - "app/agents/"
        - "app/audit/"
        - "tests/"
        - "AGENTS.md"
        - "tasks.yaml"
      forbidden_paths:
        - ".env"
        - "生产密钥"
      deliverables:
        - "每个工具声明权限、风险等级、副作用、超时、幂等性"
        - "工具调用写入审计事件"
      non_goals:
        - "不实现审批流 UI"
        - "不改既有工具的业务行为"
    acceptance:
      - "工具注册表可输出每个工具的十要素"
      - "一次工具调用产生一条可查询的审计记录"
      - "L2 及以上风险工具默认保守执行"
    risk:
      level: "L1"
      side_effect: "tool-contract-tightened"
      rollback: "回退契约声明提交。"
    evaluation:
      cases:
        - "遍历工具注册表校验十要素完整"
      commands:
        - "pytest -k 'tool or audit'"
    execution:
      owner: "个人开发者"
      nightly:
        eligible: true
        production_access: false
        auto_merge: false
        auto_deploy: false

  - id: "PAGT-003"
    title: "工具调用预算与循环上限"
    status: "backlog"
    priority: "P1"
    target_date: ""
    depends_on:
      - "PAGT-002"
    context:
      problem: "缺少调用预算，异常情况下工具循环可能失控，成本与延迟不可控。"
      facts:
        - claim: "PRD §5.1.3 定义 max_tool_calls 为 10，但未在管线中落地为硬约束。"
          evidence: "PRD §5.1.3；app/agents/pipeline.py"
    scope:
      allowed_paths:
        - "app/agents/pipeline.py"
        - "app/core/config.py"
        - ".env.example"
        - "tests/"
        - "tasks.yaml"
      forbidden_paths:
        - ".env"
      deliverables:
        - "单次请求的工具调用次数达到上限后停止并返回明确原因"
        - "上限可按配置调整"
      non_goals:
        - "不做跨请求的全局配额（属 QUOTA-001）"
        - "不改 QualityGate 评分逻辑"
    acceptance:
      - "构造循环调用场景，达到上限后不再继续"
      - "返回内容说明因预算耗尽而停止"
    risk:
      level: "L1"
      side_effect: "tool-budget-enforced"
      rollback: "回退预算约束提交。"
    evaluation:
      cases:
        - "注入循环工具调用，检查是否被上限截断"
      commands:
        - "pytest -k 'pipeline or budget'"
    execution:
      owner: "个人开发者"
      nightly:
        eligible: true
        production_access: false
        auto_merge: false
        auto_deploy: false

  - id: "PAGT-004"
    title: "Plan 从文本计划升级为可编排步骤"
    status: "backlog"
    priority: "P2"
    target_date: ""
    depends_on:
      - "PAGT-002"
    context:
      problem: "计划以文本形式存在，无法被校验、重试或逐步执行，企业复杂场景难以可靠编排。"
      facts:
        - claim: "管线五阶段已实现，QualityGate 有真实评分与自纠错；但 Plan 阶段产物为文本。"
          evidence: "app/agents/pipeline.py _evaluate_quality 与 AGENT_QUALITY_THRESHOLD"
    scope:
      allowed_paths:
        - "app/agents/pipeline.py"
        - "app/agents/"
        - "tests/"
        - "tasks.yaml"
      forbidden_paths:
        - "frontend/src/"
      deliverables:
        - "Plan 输出为结构化步骤，含依赖与预期产出"
        - "步骤可逐步执行与失败定位"
      non_goals:
        - "不实现通用 DAG 调度器（属 P-WFL）"
        - "不改五阶段整体结构"
    acceptance:
      - "Plan 输出可被解析为结构化步骤"
      - "单步失败可定位到具体步骤"
    risk:
      level: "L2"
      side_effect: "plan-structure-changed"
      rollback: "保留文本计划作为降级输出，回退提交。"
    evaluation:
      cases:
        - "多步任务下检查 Plan 结构化输出"
      commands:
        - "pytest -k 'plan'"
    execution:
      owner: "个人开发者"
      nightly:
        eligible: true
        production_access: false
        auto_merge: false
        auto_deploy: false

  - id: "PAGT-005"
    title: "Skill 版本化与回归"
    status: "backlog"
    priority: "P2"
    target_date: ""
    depends_on:
      - "PAGT-001"
    context:
      problem: "技能缺少版本与回归机制，改动后无法判断是否影响既有行为。"
      facts:
        - claim: "内置技能仅 2 个 yaml。"
          evidence: "app/agents/skills/builtin/"
        - claim: "SKILL-001 与 SKILL-002 聚焦创建与管理页面，未覆盖版本与回归。"
          evidence: "tasks.yaml SKILL-001、SKILL-002"
    scope:
      allowed_paths:
        - "app/agents/skills/"
        - "tests/"
        - "tasks.yaml"
      forbidden_paths:
        - "frontend/src/"
      deliverables:
        - "技能带版本号，变更留痕"
        - "内置技能有回归用例"
      non_goals:
        - "不做技能市场"
        - "不做技能在线编辑界面"
    acceptance:
      - "修改技能内容后版本号变化并可追溯"
      - "内置技能回归用例可执行"
    risk:
      level: "L1"
      side_effect: "skill-versioning-added"
      rollback: "回退版本字段提交。"
    evaluation:
      cases:
        - "修改一个内置技能并跑回归"
      commands:
        - "pytest -k 'skill'"
    execution:
      owner: "个人开发者"
      nightly:
        eligible: true
        production_access: false
        auto_merge: false
        auto_deploy: false

  # ---------------------------------------------------------------------------
  # P-WFL · Workflow 打磨（插在 D2 之后）
  # ---------------------------------------------------------------------------

  - id: "PWFL-001"
    title: "工作流重试：指数退避与上限"
    status: "backlog"
    priority: "P1"
    target_date: ""
    depends_on:
      - "FLOW-001"
    context:
      problem: "任务执行失败即终止，临时性故障无法自愈，生产环境不可用。"
      facts:
        - claim: "工作流模块共 348 行（engine 164、scheduler 134、bridge 40），仅支持 cron 与手动触发加执行历史。"
          evidence: "app/workflow/engine.py；app/workflow/scheduler.py；app/workflow/bridge.py"
        - claim: "retry、timeout、parallel、并发控制均无实现。"
          evidence: "grep -rnE 'retry|timeout|parallel' app/workflow/ 无输出"
    scope:
      allowed_paths:
        - "app/workflow/"
        - "app/core/config.py"
        - ".env.example"
        - "tests/"
        - "tasks.yaml"
      forbidden_paths:
        - ".env"
      deliverables:
        - "失败按指数退避重试并设上限"
        - "重试次数与退避参数可配置"
      non_goals:
        - "不做分布式重试协调"
        - "不改 cron 触发机制"
    acceptance:
      - "注入一次临时失败后可自动重试成功"
      - "持续失败达到上限后停止并记录原因"
    risk:
      level: "L1"
      side_effect: "retry-behavior-added"
      rollback: "关闭重试配置开关，回退提交。"
    evaluation:
      cases:
        - "注入临时失败与永久失败两种场景"
      commands:
        - "pytest -k 'workflow or retry'"
    execution:
      owner: "个人开发者"
      nightly:
        eligible: true
        production_access: false
        auto_merge: false
        auto_deploy: false

  - id: "PWFL-002"
    title: "工作流超时与取消"
    status: "backlog"
    priority: "P1"
    target_date: ""
    depends_on:
      - "PWFL-001"
    context:
      problem: "长时间运行的任务无法中止，资源会被持续占用。"
      facts:
        - claim: "执行器无超时与取消路径。"
          evidence: "app/workflow/engine.py；grep -rn 'timeout|cancel' app/workflow/ 无输出"
    scope:
      allowed_paths:
        - "app/workflow/"
        - "app/api/routes/"
        - "tests/"
        - "tasks.yaml"
      forbidden_paths:
        - ".env"
      deliverables:
        - "任务可配置超时，超时后中止并标记"
        - "支持手动取消执行中的任务"
      non_goals:
        - "不做跨进程强制杀除"
        - "不改执行历史数据结构"
    acceptance:
      - "超时任务被标记且释放占用"
      - "取消操作可在界面或接口触发"
    risk:
      level: "L1"
      side_effect: "workflow-cancelable"
      rollback: "回退超时与取消提交。"
    evaluation:
      cases:
        - "启动长任务并触发取消"
      commands:
        - "pytest -k 'workflow'"
    execution:
      owner: "个人开发者"
      nightly:
        eligible: true
        production_access: false
        auto_merge: false
        auto_deploy: false

  - id: "PWFL-003"
    title: "工作流并发控制与幂等"
    status: "backlog"
    priority: "P1"
    target_date: ""
    depends_on:
      - "PWFL-001"
      - "OPS-001"
    context:
      problem: "同一任务重复触发会并发执行，多副本下状态错乱。"
      facts:
        - claim: "调度器无并发控制与幂等键。"
          evidence: "app/workflow/scheduler.py"
        - claim: "限流与 trace 均为内存态，多实例部署状态不共享。"
          evidence: "app/security/rate_limiter.py；app/debug/trace.py"
    scope:
      allowed_paths:
        - "app/workflow/"
        - "app/core/"
        - "tests/"
        - "tasks.yaml"
      forbidden_paths:
        - ".env"
      deliverables:
        - "同一任务同一周期的重复触发只执行一次"
        - "并发上限可配置"
      non_goals:
        - "不实现跨节点分布式锁（依赖 OPS-001 的外部化存储）"
    acceptance:
      - "重复触发不产生重复执行记录"
      - "并发达到上限后排队或拒绝"
    risk:
      level: "L2"
      side_effect: "workflow-concurrency-limited"
      rollback: "回退并发控制提交。"
    evaluation:
      cases:
        - "并发触发同一任务多次"
      commands:
        - "pytest -k 'workflow or idempot'"
    execution:
      owner: "个人开发者"
      nightly:
        eligible: true
        production_access: false
        auto_merge: false
        auto_deploy: false

  - id: "PWFL-004"
    title: "工作流失败告警与执行日志持久化"
    status: "backlog"
    priority: "P2"
    target_date: ""
    depends_on:
      - "PWFL-001"
      - "NFR-002"
    context:
      problem: "执行失败无人知晓，排查缺少完整轨迹。"
      facts:
        - claim: "已有执行历史，但无告警通道与结构化执行日志。"
          evidence: "app/workflow/engine.py；NFR-002 交付后才有 trace 字段"
    scope:
      allowed_paths:
        - "app/workflow/"
        - "app/audit/"
