[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assistant"
version = "0.1.0"
description = "企业级开源 AI 助手平台 — RAG + Agent 编排 + MCP 协议"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "ai-assistant contributors" }]
keywords = ["rag", "agent", "llm", "mcp", "chatbot", "langgraph", "fastapi"]

dependencies = [
    "fastapi==0.133.0",
    "starlette==1.3.1",
    "uvicorn[standard]==0.34.0",
    "sse-starlette==2.2.1",
    "sqlmodel==0.0.22",
    "sqlalchemy==2.0.36",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "pyjwt==2.15.1",
    "bcrypt==4.2.1",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.31",
    "httpx==0.28.1",
    "numpy==2.1.3",
    "python-docx>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
    "python-pptx>=1.0,<2.0",
    "xlrd>=2.0,<3.0",
    "pypdf==6.21.3",
    "pymupdf>=1.26,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "coverage==7.10.6",
    "pytest-asyncio==1.4.1",
    "ruff==0.8.4",
    "mypy==1.14.1",
    "types-PyYAML==6.0.12.20260906",
    "types-croniter==6.2.4.20260711",
    "pre-commit==4.7.0",
    "detect-secrets==1.5.0",
    "pip-audit==2.10.1",
]
milvus = [
    "pymilvus==2.5.11",
]
mcp = [
    "mcp>=1.2.0",
]
workflow = [
    "croniter>=2.0.0",
]
langgraph = [
    "langgraph==1.2.18",
    "langgraph-sdk==0.4.10",
]
langchain = [
    "langchain-core>=1.0,<2.0",
    "langchain-text-splitters>=1.0,<2.0",
]
llamaindex = [
    "llama-index-core>=0.12,<0.13",
]

[project.scripts]
ai-assistant = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
show_error_codes = true
warn_unused_ignores = false
disallow_untyped_defs = false
