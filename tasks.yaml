  - id: "QA-005"
    title: "既有测试失败修复：SSE 对话、文档删除清向量、混合检索与调度器"
    status: "backlog"
    priority: "P0"
    target_date: ""
    depends_on: []
    context:
      problem: "全量 pytest 有 8 个真实失败，挡住 CI 全绿；不修则 NFR-001 的流水线不能充当回归门禁。"
      facts:
        - claim: "2026-09-28 复跑 pytest -q 共收集 445 项，结果为 8 failed / 434 passed / 3 skipped，无 error。"
          evidence: "conda 环境 ai-assistant 下 python -m pytest -q --tb=no，耗时 772.97s"
        - claim: "失败集中在四组：test_chat.py 与 test_chat_controls.py 的 SSE 流式对话（3 项，ExceptionGroup）、test_p0_regression.py 的删除文档清向量、test_rag.py 的 BM25 全零混合检索（3 项）、test_workflow.py 的调度器启停。"
          evidence: "FAILED tests/test_chat.py::test_chat_stream_returns_sse；test_chat.py::test_code_result_persists_on_stream；test_chat_controls.py::test_stream_emits_conversation_id；test_p0_regression.py::test_delete_document_cleans_vectors；test_rag.py::test_hybrid_search_bm25_all_zero_*（3 项）；test_workflow.py::test_scheduler_runnable_and_start_stop"
        - claim: "早期一次实跑曾出现 65 个 error，集中在 test_rag_import_jobs、test_rag_permission_semantics、test_sandbox；本次复跑未复现，判断为外部依赖或临时目录被清理导致，不属代码缺陷。"
          evidence: "两次同为 2026-09-28、同一环境，error 数由 65 降为 0，总数同为 445"
        - claim: "需求 §4.5 要求 CI 全绿且覆盖率不低于 70%。"
          evidence: "docs/product/项目产品需求方案.md §4.5"
    scope:
      allowed_paths:
        - "tests/"
        - "app/"
        - "conftest.py"
        - "pyproject.toml"
        - "tasks.yaml"
      forbidden_paths:
        - ".env"
      deliverables:
        - "8 个失败项逐条归因，区分代码缺陷与测试自身问题"
        - "确属外部依赖缺失的用例显式跳过并写明原因"
      non_goals:
        - "不把失败改成无条件跳过来凑通过率"
        - "不降低断言强度或删断言"
        - "不为凑覆盖率新增无意义测试"
        - "不修复 test_rag_import_jobs、test_rag_permission_semantics、test_sandbox（本次未复现，复现时另立项）"
    acceptance:
      - "pytest 可完整收集且退出码可判定"
      - "8 个失败项均给出归因，属代码缺陷的已修复"
      - "覆盖率数字在 CI 或 REL-003 中报告"
    risk:
      level: "L1"
      side_effect: "test-suite-green"
      rollback: "回退测试改动提交。"
    evaluation:
      cases:
        - "全量收集与判定"
        - "SSE 流式对话单独复跑"
      commands:
        - "pytest --collect-only -q"
        - "pytest -q"
        - "pytest tests/test_chat.py tests/test_chat_controls.py -q"
        - "pytest tests/test_p0_regression.py tests/test_rag.py tests/test_workflow.py -q"
    execution:
      owner: "个人开发者"
      nightly:
        eligible: true
        production_access: false
        auto_merge: false
        auto_deploy: false

  - id: "NFR-011"
    title: "检索可用性自检：health 暴露 Embedding 状态与模型维度"
    status: "backlog"
    priority: "P0"
    target_date: ""
    depends_on: []
    context:
      problem: "生产缺密钥时的 fail-fast 已存在，但 /health 不体现检索可用性，也无法确认线上实际使用的模型与维度；Mock 跑出的 Recall 或延迟不能当上线证据。"
      facts:
        - claim: "生产环境缺 EMBEDDING_API_KEY 时已抛 RuntimeError，不会回退 Mock。"
          evidence: "app/rag/embeddings/factory.py：raise RuntimeError（生产环境必须配置 EMBEDDING_API_KEY）"
        - claim: "/health 现有字段只有 database、vector_store、llm，没有 embedding 可用性。"
          evidence: "app/api/routes/health.py health_check 返回结构"
        - claim: "规范规定 Mock 只能证明链路，不能证明检索质量；生产缺密钥时检索应失败。"
          evidence: "AGENTS.md：无真实 Embedding 时开发环境用 Mock，只能证明链路，不能证明检索质量"
    scope:
      allowed_paths:
        - "app/api/routes/health.py"
        - "app/rag/embeddings/"
        - "app/core/config.py"
        - "tests/"
        - "tasks.yaml"
      forbidden_paths:
        - ".env"
      deliverables:
        - "/health 增加 embedding 可用性字段，含 provider 与维度"
        - "评测与压测报告记录所用 Embedding 模型与维度"
      non_goals:
        - "不更换 Embedding 模型"
        - "不重做索引"
        - "不改生产 fail-fast 行为，该行为已实现"
    acceptance:
      - "进程已启动时 /health 输出 embedding 的 provider、模型、维度，以及当前是否为 Mock"
      - "生产缺 EMBEDDING_API_KEY 时保持启动失败，本卡不改这个行为"
      - "开发环境降级为 Mock 时 /health 标注该结果不可作为上线证据"
      - "压测与检索报告可追溯到模型与维度"
    risk:
      level: "L1"
      side_effect: "health-response-extended"
      rollback: "回退 health 字段提交。"
    evaluation:
      cases:
        - "分别在有密钥与无密钥配置下检查 /health"
      commands:
        - "pytest -k 'health'"
    execution:
      owner: "个人开发者"
      nightly:
        eligible: true
        production_access: false
        auto_merge: false
        auto_deploy: false
