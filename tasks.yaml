schema_version: "1.0"

project:
  name: "ai-assistant"
  mode: "brownfield"
  repository: "https://github.com/lwmjava/ai-assistant"
  branch_baseline: "main"
  rules:
    - "AGENTS.md"
  # 以下为按需索引；阅读路由与门禁只由 AGENTS.md 解释。
  product_docs:
    - "docs/product/项目产品需求方案.md"
    - "docs/product/项目设计方案.md"
    - "docs/product/as-is-capability-matrix.md"
  workflows:
    - "docs/workflows/end-to-end-development.md"
    - "docs/workflows/nightly-autonomous-development.md"
    - "docs/workflows/bugfix-and-incident.md"
  checklists:
    - "docs/checklists/anti-drift-checklist.md"
    - "docs/checklists/morning-review-checklist.md"
    - "docs/checklists/review-and-release-checklist.md"
  commands:
    backend_test: "pytest"
    rag_test: "pytest tests/test_rag.py tests/test_rag_import_jobs.py tests/test_rag_backend.py tests/test_chunking.py -v"
    lint: "ruff check ."
    typecheck: "mypy app/"
    frontend_install: "cd frontend; npm ci"
    frontend_typecheck: "cd frontend; npm run typecheck"
    frontend_build: "cd frontend; npm run build"
  reading_policy: "按AGENTS.md第2节读取全局策略、当前卡与直接依赖摘要；历史must_read仅作按需索引，任务专属要求保留。"
  delivery_record_policy: "按AGENTS.md第9节分级；新卡保留ID/目标/状态/依赖/范围/验收/风险/交付记录链接，复用全局策略；同一记录写计划与实际结果，不复制过程日志或按固定行数裁剪。"
  review_policy: "普通任务自审，复杂边界或明确要求时独立审查；阻断项闭合即退出，无新证据不重复最终审核；技术审查不冒充人工业务接受。"
  artifact_policy: "按AGENTS.md第11节区分文档、scripts、tests、evals及临时产物；存量引用先核对再迁移，不删除历史证据。"
  evidence_policy: "事实引用代码、配置、测试、Trace、数据或已批准文档；假设必须标记并给出验证动作。"
  regression_gate_policy: "任务关闭与提交前执行 AGENTS.md 第10节强制回归：公共路径全量pytest、适用Linux检查、最终输入指纹/提交SHA绑定；必要检查失败、缺失或过期不得关闭业务任务。纯文档治理按文档契约验证，不代表业务CI通过。"
  source_comment_policy: "每次改代码都必须遵守：源代码、测试、前端和迁移脚本里的注释与文档字符串只描述当前行为。不得写入任务编号、ADR 编号、需求或设计文档名称、修订日期，以及依据哪份文档实现的说明。文档追溯只放在 tasks.yaml、ADR 和计划文档中。"
  commit_message_policy: "每次 git 提交都必须遵守：提交说明只写实现了什么功能，或修复了什么问题。不得写入需求编号、任务编号、ADR 编号，也不得写依据哪份需求、设计或计划文档。文档追溯只放在 tasks.yaml、ADR 和计划文档中。"
  capacity_policy: "个人开发按理论产能的60%-70%排期，其余用于取证、联调、返工、审核和发布。"

status_values:
  - "backlog"
  - "ready"
  - "nightly_ready"
  - "in_progress"
  - "blocked"
  - "in_review"
  - "done"
  - "cancelled"

risk_policy:
  L0: "授权后的只读、低敏操作"
  L1: "低风险可逆写；需要鉴权、幂等和审计"
  L2: "中风险或跨系统写；默认保守，必要时人工审批"
  L3: "退款、删除、合同、财务、权限提升或不可逆敏感操作；必须人工审批"

